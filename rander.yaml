version: "1"
projects:
- name: Brainstorm App
  environments:
  - name: Production
    services:
    - type: web
      name: brainstorm-app-api
      runtime: node
      repo: https://github.com/o-mirza/brainstorm-app
      plan: free
      region: ohio
      envVars:
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      buildCommand: >-
        corepack prepare pnpm@11.7.0 --activate && 
        pnpm install --frozen-lockfile && 
        pnpm --filter @brainstorm/shared build && 
        pnpm --filter @brainstorm/api build
      startCommand: >-
        pnpm --filter @brainstorm/api drizzle-kit migrate && 
        pnpm --filter @brainstorm/api start
      autoDeployTrigger: commit

    - type: web
      name: brainstorm-app
      runtime: static
      repo: https://github.com/o-mirza/brainstorm-app
      envVars:
      - key: VITE_WS_BASE_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      buildCommand: >-
        corepack prepare pnpm@11.7.0 --activate && 
        pnpm install --frozen-lockfile && 
        pnpm --filter @brainstorm/shared build && 
        pnpm --filter @brainstorm/web build
      staticPublishPath: apps/web/dist
      routes:
      - type: rewrite
        source: /*
        destination: /index.html
      autoDeployTrigger: commit